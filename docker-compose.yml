services:
  postgres:
    image: postgres:18.6
    container_name: real-estate-auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-micro_auth_service_db}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME} -d ${AUTH_DB_NAME:-micro_auth_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-profile-postgres:
    image: postgres:18.6
    container_name: real-estate-user-profile-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${USER_PROFILE_DB_NAME:-micro_user_profile_service_db}
      POSTGRES_USER: ${USER_PROFILE_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_PROFILE_DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - user_profile_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_PROFILE_DB_USERNAME} -d ${USER_PROFILE_DB_NAME:-micro_user_profile_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-postgres:
    image: postgres:18.6
    container_name: real-estate-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:-micro_agent_service_db}
      POSTGRES_USER: ${AGENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - agent_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_DB_USERNAME} -d ${AGENT_DB_NAME:-micro_agent_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-mysql:
    image: mysql:8.4.11
    container_name: real-estate-agent-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${AGENT_DB_NAME:-micro_agent_service_db}
      MYSQL_USER: ${AGENT_DB_USERNAME}
      MYSQL_PASSWORD: ${AGENT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${AGENT_DB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - agent_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"${AGENT_DB_USERNAME}\" -p\"${AGENT_DB_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  buyer-postgres:
    image: postgres:18.6
    container_name: real-estate-buyer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${BUYER_DB_NAME:-micro_buyer_service_db}
      POSTGRES_USER: ${BUYER_DB_USERNAME}
      POSTGRES_PASSWORD: ${BUYER_DB_PASSWORD}

    ports:
      - "5436:5432"

    volumes:
      - buyer_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUYER_DB_USERNAME} -d ${BUYER_DB_NAME:-micro_buyer_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  buyer-couchbase:
    image: couchbase:community-8.0.2
    container_name: real-estate-buyer-couchbase
    restart: unless-stopped

    environment:
      COUCHBASE_ADMIN_USERNAME: ${COUCHBASE_ADMIN_USERNAME}
      COUCHBASE_ADMIN_PASSWORD: ${COUCHBASE_ADMIN_PASSWORD}

    ports:
      - "8091:8091"
      - "11210:11210"

    volumes:
      - buyer_couchbase_data:/opt/couchbase/var

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/pools >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  property-postgres:
    image: postgres:18.6
    container_name: real-estate-property-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PROPERTY_DB_NAME:-micro_property_service_db}
      POSTGRES_USER: ${PROPERTY_DB_USERNAME}
      POSTGRES_PASSWORD: ${PROPERTY_DB_PASSWORD}

    ports:
      - "5437:5432"

    volumes:
      - property_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROPERTY_DB_USERNAME} -d ${PROPERTY_DB_NAME:-micro_property_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property-mongodb:
    image: mongo:8.0.30
    container_name: real-estate-property-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${PROPERTY_MONGO_DB_NAME:-micro_property_service_db}
      MONGO_INITDB_ROOT_USERNAME: ${PROPERTY_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PROPERTY_MONGO_ROOT_PASSWORD}

    ports:
      - "27018:27017"

    volumes:
      - property_mongodb_data:/data/db

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"${PROPERTY_MONGO_ROOT_USERNAME}\" --password \"${PROPERTY_MONGO_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seller-postgres:
    image: postgres:18.6
    container_name: real-estate-seller-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SELLER_DB_NAME:-micro_seller_service_db}
      POSTGRES_USER: ${SELLER_DB_USERNAME}
      POSTGRES_PASSWORD: ${SELLER_DB_PASSWORD}

    ports:
      - "5438:5432"

    volumes:
      - seller_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SELLER_DB_USERNAME} -d ${SELLER_DB_NAME:-micro_seller_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seller-cassandra:
    image: cassandra:5.0.9
    container_name: real-estate-seller-cassandra
    restart: unless-stopped

    environment:
      CASSANDRA_CLUSTER_NAME: real-estate-local
      CASSANDRA_DC: datacenter1

    ports:
      - "9042:9042"

    volumes:
      - seller_cassandra_data:/var/lib/cassandra

    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local;\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: real-estate-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  user_profile_postgres_data:
  agent_postgres_data:
  agent_mysql_data:
  buyer_postgres_data:
  buyer_couchbase_data:
  property_postgres_data:
  property_mongodb_data:
  seller_postgres_data:
  seller_cassandra_data:
  rabbitmq_data:
