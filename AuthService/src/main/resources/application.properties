# Uygulamanın çalışacağı port
# server.port=9090

# Spring Boot uygulama / servis adı
# spring.application.name=auth-service

# PostgreSQL bağlantı adresi
# AUTH_DB_URL environment variable tanımlıysa onu kullanır.
# Tanımlı değilse varsayılan olarak localhost:5433 üzerindeki micro_auth_service_db veritabanına bağlanır.
# spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5433/micro_auth_service_db}

# PostgreSQL kullanıcı adı
# AUTH_DB_USERNAME tanımlı değilse varsayılan kullanıcı: aydin
# spring.datasource.username=${AUTH_DB_USERNAME:aydin}

# PostgreSQL kullanıcı şifresi
# AUTH_DB_PASSWORD tanımlı değilse varsayılan şifre: 123456!
# spring.datasource.password=${AUTH_DB_PASSWORD:123456!}

# Hibernate mevcut entity yapısına göre veritabanı şemasını otomatik günceller
# spring.jpa.hibernate.ddl-auto=update

# EntityManager'ın web request boyunca açık tutulmasını engeller
# spring.jpa.open-in-view=false

# Hibernate tarafından oluşturulan SQL sorgularını konsolda gösterir
# spring.jpa.show-sql=true

# Swagger UI erişim yolu
# springdoc.swagger-ui.path=/swagger-ui.html

# JWT token üretiminde kullanılan gizli anahtar
# AUTH_JWT_SECRET tanımlı değilse varsayılan değer kullanılır
# authservice.secret.key=${AUTH_JWT_SECRET:java44-auth-service-secret-key}

# JWT token issuer bilgisi
# authservice.issuer=${AUTH_JWT_ISSUER:java-44-auth-service}

# JWT token geçerlilik süresi
# 300000 ms = 5 dakika
# authservice.expire.date=${AUTH_JWT_EXPIRE_MS:300000}