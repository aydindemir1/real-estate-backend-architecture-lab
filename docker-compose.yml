services:
  postgres:
    image: postgres:18.6
    container_name: java44-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: micro_auth_service_db
      POSTGRES_USER: aydin
      POSTGRES_PASSWORD: "123456!"

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aydin -d micro_auth_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-profile-postgres:
    image: postgres:18.6
    container_name: java44-user-profile-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: micro_user_profile_service_db
      POSTGRES_USER: aydin
