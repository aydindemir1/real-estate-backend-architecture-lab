ext {
    versions = [
            springBoot               : "4.1.1",
            springCloud              : "2025.1.3",
            lombok                   : "1.18.42",
            mapStruct                : "1.6.3",
            postgreSql               : "42.7.8",
            swaggerApi               : "3.1.1",
            jwt                      : "4.6.1",
            lombokMapstructBinding   : "0.2.0"
    ]

    libs = [
            springBootWeb                               : "org.springframework.boot:spring-boot-starter-webmvc:$versions.springBoot",
            springBootDataJpa                           : "org.springframework.boot:spring-boot-starter-data-jpa:$versions.springBoot",
            springBootDataCouchbase                     : "org.springframework.boot:spring-boot-starter-data-couchbase:$versions.springBoot",
            springBootDataCassandra                     : "org.springframework.boot:spring-boot-starter-data-cassandra:$versions.springBoot",
            springBootDataMongoDb                       : "org.springframework.boot:spring-boot-starter-data-mongodb:$versions.springBoot",
            springBootDataElasticsearch                 : "org.springframework.boot:spring-boot-starter-data-elasticsearch:$versions.springBoot",
            springBootDataRedis                         : "org.springframework.boot:spring-boot-starter-data-redis:$versions.springBoot",
            springBootTest                              : "org.springframework.boot:spring-boot-starter-test:$versions.springBoot",
            springBootActuator                          : "org.springframework.boot:spring-boot-starter-actuator:$versions.springBoot",
            springBootZipkin                            : "org.springframework.boot:spring-boot-starter-zipkin:$versions.springBoot",
            springBootAmqp                              : "org.springframework.boot:spring-boot-starter-amqp:$versions.springBoot",
            junitPlatformLauncher                       : "org.junit.platform:junit-platform-launcher",

            springCloudOpenFeign                        : "org.springframework.cloud:spring-cloud-starter-openfeign",
            springCloudStarterConfig                    : "org.springframework.cloud:spring-cloud-starter-config",
            springCloudConfigServer                     : "org.springframework.cloud:spring-cloud-config-server",
            springCloudGatewayServerWebMvc              : "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc",
            springCloudEurekaClient                     : "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client",
            springCloudEurekaServer                     : "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server",
            springCloudLoadBalancer                      : "org.springframework.cloud:spring-cloud-starter-loadbalancer",
            springCloudCircuitBreakerReactorResilience4j: "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j",
            feignMicrometer                             : "io.github.openfeign:feign-micrometer",

            postgreSql                                  : "org.postgresql:postgresql:$versions.postgreSql",
            mySql                                       : "com.mysql:mysql-connector-j",
            testcontainersJunitJupiter                  : "org.testcontainers:junit-jupiter",

            lombok                                      : "org.projectlombok:lombok:$versions.lombok",
            lombokMapstructBinding                      : "org.projectlombok:lombok-mapstruct-binding:$versions.lombokMapstructBinding",
            mapStruct                                   : "org.mapstruct:mapstruct:$versions.mapStruct",
            mapStructProcessor                          : "org.mapstruct:mapstruct-processor:$versions.mapStruct",

            swaggerApi                                  : "org.springdoc:springdoc-openapi-starter-webmvc-ui:$versions.swaggerApi",
            jwt                                         : "com.auth0:java-jwt:$versions.jwt"
    ]
}
