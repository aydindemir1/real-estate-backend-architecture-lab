name: SellerService CI

on:
  push:
    branches:
      - day/10-seller-cassandra-onion
    paths:
      - "SellerService/**"
      - "build.gradle"
      - "dependencies.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/seller-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: SellerService Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Compile SellerService tests
        run: ./gradlew :SellerService:testClasses --stacktrace

      - name: Run SellerService tests
        run: ./gradlew :SellerService:test --stacktrace

      - name: Upload SellerService test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-service-test-reports
          path: |
            SellerService/build/test-results/test/**
            SellerService/build/reports/tests/test/**
          if-no-files-found: warn
