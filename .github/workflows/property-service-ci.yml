name: PropertyService CI

on:
  push:
    branches:
      - day/11-property-mongodb-vertical-slice
    paths:
      - "PropertyService/**"
      - "ConfigServerLocal/src/main/resources/config-repo/property-service.yml"
      - "build.gradle"
      - "dependencies.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/property-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PropertyService Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Compile PropertyService tests
        run: ./gradlew :PropertyService:testClasses --stacktrace

      - name: Run PropertyService tests
        run: ./gradlew :PropertyService:test --stacktrace

      - name: Upload PropertyService test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-service-test-reports
          path: |
            PropertyService/build/test-results/test/**
            PropertyService/build/reports/tests/test/**
          if-no-files-found: warn
