      RABBITMQ_DEFAULT_USER: java44
      RABBITMQ_DEFAULT_PASS: java44

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  user_profile_postgres_data:
  agent_postgres_data:
  buyer_postgres_data:
  property_postgres_data:
  seller_postgres_data:
  rabbitmq_data:
